<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1500" height="1000" rx="18" ry="18" style="fill:#c8dbc3;"/>
<text x="750" y="70" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:40px; fill:#12750f; font-weight:700; stroke:#12750f; stroke-width:1.6px; paint-order:stroke fill;">分子量の求め方</text>
<rect x="80" y="120" width="1340" height="830" rx="16" style="fill:#fff; stroke:#12750f; stroke-width:5px;"/>
<text x="750" y="185" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:30px; fill:#111; font-weight:700;">まず、各元素の原子量（基準値）を確認する</text>
<rect x="350" y="220" width="330" height="120" rx="12" style="fill:#eef4ff; stroke:#2f6fb0; stroke-width:3px;"/>
<text x="515" y="275" text-anchor="middle" style="font-family:'Courier New',monospace; font-size:44px; fill:#2f6fb0; font-weight:700;">H = 1</text>
<text x="515" y="315" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:22px; fill:#333;">水素の原子量</text>
<rect x="820" y="220" width="330" height="120" rx="12" style="fill:#ffe3d6; stroke:#c0392b; stroke-width:3px;"/>
<text x="985" y="275" text-anchor="middle" style="font-family:'Courier New',monospace; font-size:44px; fill:#c0392b; font-weight:700;">O = 16</text>
<text x="985" y="315" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:22px; fill:#333;">酸素の原子量</text>
<line x1="120" y1="385" x2="1380" y2="385" style="stroke:#c8dbc3; stroke-width:3px;"/>
<text x="750" y="440" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:30px; fill:#111; font-weight:700;">次に、分子に含まれる原子量を足し合わせる</text>
<line x1="120" y1="530" x2="1380" y2="530" style="stroke:#111; stroke-width:2px;"/>
<text x="180" y="510" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:26px; fill:#111; font-weight:700;">物質</text>
<text x="380" y="510" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:26px; fill:#111; font-weight:700;">分子式</text>
<text x="560" y="510" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:26px; fill:#111; font-weight:700;">構成</text>
<text x="900" y="510" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:26px; fill:#111; font-weight:700;">計算</text>
<text x="1260" y="510" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:26px; fill:#111; font-weight:700;">分子量</text>
<text x="180" y="560" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:26px; fill:#111;">水素分子</text>
<text x="380" y="560" text-anchor="middle" style="font-family:'Courier New',monospace; font-size:30px; fill:#111; font-weight:700;">H2</text>
<text x="560" y="560" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:22px; fill:#333;">Hが2個</text>
<text x="900" y="560" text-anchor="middle" style="font-family:'Courier New',monospace; font-size:26px; fill:#111;">H(1) x 2</text>
<text x="1260" y="560" text-anchor="middle" style="font-family:'Courier New',monospace; font-size:32px; fill:#12750f; font-weight:700;">= 2</text>
<line x1="120" y1="610" x2="1380" y2="610" style="stroke:#ddd; stroke-width:2px;"/>
<text x="180" y="700" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:26px; fill:#111;">酸素分子</text>
<text x="380" y="700" text-anchor="middle" style="font-family:'Courier New',monospace; font-size:30px; fill:#111; font-weight:700;">O2</text>
<text x="560" y="700" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:22px; fill:#333;">Oが2個</text>
<text x="900" y="700" text-anchor="middle" style="font-family:'Courier New',monospace; font-size:26px; fill:#111;">O(16) x 2</text>
<text x="1260" y="700" text-anchor="middle" style="font-family:'Courier New',monospace; font-size:32px; fill:#12750f; font-weight:700;">= 32</text>
<line x1="120" y1="750" x2="1380" y2="750" style="stroke:#ddd; stroke-width:2px;"/>
<text x="180" y="840" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:26px; fill:#111;">水</text>
<text x="380" y="840" text-anchor="middle" style="font-family:'Courier New',monospace; font-size:30px; fill:#111; font-weight:700;">H2O</text>
<text x="560" y="840" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:22px; fill:#333;">Hが2個、Oが1個</text>
<text x="900" y="840" text-anchor="middle" style="font-family:'Courier New',monospace; font-size:26px; fill:#111;">H(1)x2 + O(16)</text>
<text x="1260" y="840" text-anchor="middle" style="font-family:'Courier New',monospace; font-size:32px; fill:#12750f; font-weight:700;">= 18</text>
</svg>