name: Deploy Migrations

# 本番の DB に、main にマージした migration を適用する。
# migration を含む PR では、適用される予定の migration を表示するだけで、本番は変更しない（--dry-run）。
# 接続には Session pooler（IPv4）の接続文字列を使う。GitHub Actions の実行環境は IPv6 の直接接続を使えないため。
# supabase link を使わないのは、link が service_role キーを含む API キーを読むため。CI に渡す秘密情報を DB の接続文字列だけにする。
on:
  pull_request:
    paths: ['supabase/migrations/**', '.github/workflows/deploy-migrations.yml']
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: 適用される予定の migration を表示する（本番は変更しない）
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"
      - name: 本番の DB に適用する
        if: github.event_name != 'pull_request'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
