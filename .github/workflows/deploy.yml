name: Deploy

# 本番に、main にマージした migration と Edge Functions を反映する。
# Edge Functions は、migration の適用が成功してから反映する（needs）。関数が先に反映されると、
# 関数が使う DB の構成（テーブル・列・関数）がまだない間に呼ばれて失敗するため。
# migration の適用が失敗したときは、Edge Functions を反映しない。
#
# migration を含む PR では、適用される予定の migration を表示するだけで、本番は変更しない（--dry-run）。
# 接続には Session pooler（IPv4）の接続文字列を使う。GitHub Actions の実行環境は IPv6 の直接接続を使えないため。
# supabase link を使わないのは、link が service_role キーを含む API キーを読むため。migration の適用に渡す秘密情報を DB の接続文字列だけにする。
on:
  pull_request:
    paths: ['supabase/migrations/**', '.github/workflows/deploy.yml']
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 本番への反映は1つずつ行う。PR の確認は PR ごとの group に分ける。
# 同じ group で待っている実行は、次の実行が来ると取り消されるため、PR の確認が本番への反映の待ちを取り消さないようにする。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.event.pull_request.number) || 'deploy-production' }}
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: 適用される予定の migration を表示する（本番は変更しない）
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"
      - name: 本番の DB に適用する
        if: github.event_name != 'pull_request'
        run: supabase db push --db-url "$SUPABASE_DB_URL"

  functions:
    needs: migrations
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: 本番に Edge Functions を反映する
        run: supabase functions deploy --project-ref vyzkkkskmwyctznbczzr
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
