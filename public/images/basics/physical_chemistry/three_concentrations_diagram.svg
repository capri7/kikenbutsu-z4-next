<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1500" height="900" rx="18" ry="18" style="fill:#c8dbc3;"/>
<text x="750" y="70" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:40px; fill:#12750f; font-weight:700; stroke:#12750f; stroke-width:1.6px; paint-order:stroke fill;">3つの濃度の比べ方</text>
<rect x="80" y="120" width="1340" height="720" rx="16" style="fill:#fff; stroke:#12750f; stroke-width:5px;"/>
<text x="280" y="185" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:30px; fill:#2f6fb0; font-weight:700;">質量パーセント濃度</text>
<text x="280" y="230" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:21px; fill:#333;">溶液に含まれる</text>
<text x="280" y="258" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:21px; fill:#333;">溶質の質量の割合</text>
<rect x="90" y="300" width="380" height="220" rx="12" style="fill:#f5f3ff; stroke:#2f6fb0; stroke-width:3px;"/>
<text x="280" y="355" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:24px; fill:#111; font-weight:700;">溶質の質量(g)</text>
<line x1="120" y1="380" x2="440" y2="380" style="stroke:#111; stroke-width:3px;"/>
<text x="280" y="425" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:24px; fill:#111; font-weight:700;">溶液の質量(g)</text>
<text x="280" y="480" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:28px; fill:#2f6fb0; font-weight:700;">×100</text>
<text x="280" y="570" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:26px; fill:#2f6fb0; font-weight:700;">単位：％</text>
<text x="750" y="185" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:30px; fill:#c0392b; font-weight:700;">モル濃度</text>
<text x="750" y="230" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:21px; fill:#333;">溶液1L中に含まれる</text>
<text x="750" y="258" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:21px; fill:#333;">溶質の物質量</text>
<rect x="560" y="300" width="380" height="220" rx="12" style="fill:#f5f3ff; stroke:#c0392b; stroke-width:3px;"/>
<text x="750" y="355" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:24px; fill:#111; font-weight:700;">溶質の物質量(mol)</text>
<line x1="590" y1="380" x2="910" y2="380" style="stroke:#111; stroke-width:3px;"/>
<text x="750" y="425" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:24px; fill:#111; font-weight:700;">溶液の体積(L)</text>
<text x="750" y="570" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:26px; fill:#c0392b; font-weight:700;">単位：mol/L</text>
<text x="1220" y="185" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:30px; fill:#7a3d0f; font-weight:700;">質量モル濃度</text>
<text x="1220" y="230" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:21px; fill:#333;">溶媒1kg中に含まれる</text>
<text x="1220" y="258" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:21px; fill:#333;">溶質の物質量</text>
<rect x="1030" y="300" width="380" height="220" rx="12" style="fill:#f5f3ff; stroke:#7a3d0f; stroke-width:3px;"/>
<text x="1220" y="355" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:24px; fill:#111; font-weight:700;">溶質の物質量(mol)</text>
<line x1="1060" y1="380" x2="1380" y2="380" style="stroke:#111; stroke-width:3px;"/>
<text x="1220" y="425" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:24px; fill:#111; font-weight:700;">溶媒の質量(kg)</text>
<text x="1220" y="570" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:26px; fill:#7a3d0f; font-weight:700;">単位：mol/kg</text>
<line x1="520" y1="160" x2="520" y2="700" style="stroke:#c8dbc3; stroke-width:3px;"/>
<line x1="985" y1="160" x2="985" y2="700" style="stroke:#c8dbc3; stroke-width:3px;"/>
<rect x="150" y="740" width="1200" height="80" rx="12" style="fill:#fff3cd; stroke:#e0a800; stroke-width:3px;"/>
<text x="750" y="790" text-anchor="middle" style="font-family:HiraKakuStd-W8-83pv-RKSJ-H,'Hiragino Kaku Gothic Std','Noto Sans CJK JP',sans-serif; font-size:26px; fill:#7a5c00; font-weight:700;">注意：モル濃度は「溶液」、質量モル濃度は「溶媒」を使う点が異なる</text>
</svg>