<svg xmlns="http://www.w3.org/2000/svg" width="720" height="335" viewBox="0 0 720 335" role="img">
<title>接地（アース）</title>
<desc>タンクとポンプを、それぞれ独立した導線で大地に接続し、静電気を地中へ逃がす接地の模式図。ボンディングと異なり、タンクとポンプは互いに直接接続されていない。</desc>

<text x="360" y="55" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="18" font-weight="500" fill="#2C2C2A">【接地（アース）】</text>

<g fill="#F1EFE8" stroke="#5F5E5A">
<rect x="105" y="130" width="170" height="160" rx="4" stroke-width="0.5"/>
<ellipse cx="190" cy="290" rx="85" ry="18" stroke-width="0.5"/>
</g>
<rect x="110" y="195" width="160" height="90" fill="#B5D4F4"/>
<ellipse cx="190" cy="195" rx="80" ry="13" fill="#B5D4F4"/>
<ellipse cx="190" cy="130" rx="85" ry="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="70" y="100" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">タンク</text>

<path d="M205,235 L205,100 Q205,80 225,80 L445,80 Q470,80 470,105 L470,175" stroke="#888780" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

<g fill="#F1EFE8" stroke="#5F5E5A">
<rect x="460" y="175" width="140" height="100" rx="16" stroke-width="0.5"/>
<rect x="480" y="275" width="100" height="12" rx="3" stroke-width="0.5"/>
</g>
<text x="530" y="308" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">ポンプ</text>

<path d="M107,205 Q70,245 60,270" stroke="#D85A30" stroke-width="2.5" fill="none"/>
<circle cx="107" cy="205" r="3.5" fill="#D85A30"/>
<line x1="60" y1="270" x2="60" y2="283" stroke="#444441" stroke-width="2.5"/>
