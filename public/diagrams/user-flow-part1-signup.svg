<svg width="680" height="424" viewBox="0 0 680 424" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ユーザーフロー：検索流入からメール登録まで</title>
<desc>基礎知識ページへの検索流入から、節を読み、メール登録導線をクリックし、メール登録が完了するまでの流れ</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="210" y="40" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">基礎知識ページに検索流入</text>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">SEO経由・認証不要</text>

<rect x="210" y="136" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">節を読む</text>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">ミニクイズで理解度確認</text>

<rect x="210" y="232" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">メール登録導線をクリック</text>
<text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">ページ内のCTAから</text>

<rect x="210" y="328" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">メール登録完了</text>
<text x="340" y="368" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">30秒・ログイン不要</text>

<line x1="340" y1="96" x2="340" y2="136" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="192" x2="340" y2="232" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="288" x2="340" y2="328" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
