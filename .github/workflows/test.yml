name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vitest
        run: npm test -- --run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Deno.test
        run: deno test supabase/functions/

      - name: deno check（Edge Functions の index.ts の型の検査）
        # リポジトリの一番上に package.json があるため、npm の依存を node_modules から探さないよう none を指定する
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: 2.115.0

      # stripe-webhook の E2E（paid-conversion.spec.ts）で使う、テスト専用の値（本物の鍵ではない）。
      # supabase start が supabase/functions/.env を読み込む
      - name: Edge Functions のテスト用の環境変数
        run: printf 'STRIPE_WEBHOOK_SECRET=whsec_e2e_local_only\nSTRIPE_SECRET_KEY=sk_test_e2e_dummy\n' > supabase/functions/.env

      # migrations と seed.sql を適用したローカルの Supabase を起動する
      - name: Start local Supabase
        run: supabase start
      - name: DB のテスト（pgTAP）
        run: supabase test db

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # 接続先は playwright.config.ts が supabase status から取得する
      - name: Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
