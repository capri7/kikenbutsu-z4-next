<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1050px" version="1.1" viewBox="0 0 1400 1050" width="1400px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="1050" width="1400" x="0" y="0" /><text fill="#3d3d3a" font-family="Noto Sans CJK JP" font-size="18" font-weight="bold" x="30" y="34">Stripe / Supabase 連携シーケンス図（決済〜Webhook同期）</text><rect fill="#185fa5" height="46" rx="3" ry="3" stroke="none" width="190" x="-35.0" y="74" /><text fill="white" font-family="Noto Sans CJK JP" font-size="12.5" font-weight="bold" text-anchor="middle" x="60" y="101.0">ブラウザ</text><line stroke="#85b7eb" stroke-dasharray="4,3" stroke-width="1.5" x1="60" x2="60" y1="120" y2="950" /><rect fill="#185fa5" height="46" rx="3" ry="3" stroke="none" width="190" x="205.0" y="74" /><text fill="white" font-family="Noto Sans CJK JP" font-size="12.5" font-weight="bold" text-anchor="middle" x="300" y="94.0">create-checkout-</text><text fill="white" font-family="Noto Sans CJK JP" font-size="12.5" font-weight="bold" text-anchor="middle" x="300" y="108.0">session</text><line stroke="#85b7eb" stroke-dasharray="4,3" stroke-width="1.5" x1="300" x2="300" y1="120" y2="950" /><rect fill="#185fa5" height="46" rx="3" ry="3" stroke="none" width="190" x="445.0" y="74" /><text fill="white" font-family="Noto Sans CJK JP" font-size="12.5" font-weight="bold" text-anchor="middle" x="540" y="101.0">Stripe</text><line stroke="#85b7eb" stroke-dasharray="4,3" stroke-width="1.5" x1="540" x2="540" y1="120" y2="950" /><rect fill="#185fa5" height="46" rx="3" ry="3" stroke="none" width="190" x="685.0" y="74" /><text fill="white" font-family="Noto Sans CJK JP" font-size="12.5" font-weight="bold" text-anchor="middle" x="780" y="101.0">stripe-webhook</text><line stroke="#85b7eb" stroke-dasharray="4,3" stroke-width="1.5" x1="780" x2="780" y1="120" y2="950" /><rect fill="#185fa5" height="46" rx="3" ry="3" stroke="none" width="190" x="925.0" y="74" /><text fill="white" font-family="Noto Sans CJK JP" font-size="12.5" font-weight="bold" text-anchor="middle" x="1020" y="87.0">Supabase DB</text><text fill="white" font-family="Noto Sans CJK JP" font-size="12.5" font-weight="bold" text-anchor="middle" x="1020" y="101.0">(subscriptions /</text><text fill="white" font-family="Noto Sans CJK JP" font-size="12.5" font-weight="bold" text-anchor="middle" x="1020" y="115.0">user_profiles)</text><line stroke="#85b7eb" stroke-dasharray="4,3" stroke-width="1.5" x1="1020" x2="1020" y1="120" y2="950" /><rect fill="#185fa5" height="46" rx="3" ry="3" stroke="none" width="190" x="1165.0" y="74" /><text fill="white" font-family="Noto Sans CJK JP" font-size="12.5" font-weight="bold" text-anchor="middle" x="1260" y="94.0">マイページ</text><text fill="white" font-family="Noto Sans CJK JP" font-size="12.5" font-weight="bold" text-anchor="middle" x="1260" y="108.0">(クライアント)</text><line stroke="#85b7eb" stroke-dasharray="4,3" stroke-width="1.5" x1="1260" x2="1260" y1="120" y2="950" /><line stroke="#9aa0a6" stroke-dasharray="none" stroke-width="1.4" x1="60" x2="290" y1="175" y2="175" /><polygon fill="#9aa0a6" points="290,171 290,179 300,175" /><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="180.0" y="153">① POST /create-checkout-session</text><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="180.0" y="167">{ priceId, user_id }</text><line stroke="#9aa0a6" stroke-dasharray="none" stroke-width="1.4" x1="300" x2="530" y1="225" y2="225" /><polygon fill="#9aa0a6" points="530,221 530,229 540,225" /><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="420.0" y="217">② checkout.sessions.create()</text><line stroke="#9aa0a6" stroke-dasharray="5,4" stroke-width="1.4" x1="540" x2="310" y1="270" y2="270" /><polygon fill="#9aa0a6" points="310,266 310,274 300,270" /><text fill="#3d3d3a" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="420.0" y="262">③ session.url</text><line stroke="#9aa0a6" stroke-dasharray="5,4" stroke-width="1.4" x1="300" x2="70" y1="315" y2="315" /><polygon fill="#9aa0a6" points="70,311 70,319 60,315" /><text fill="#3d3d3a" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="180.0" y="307">④ { url }</text><line stroke="#9aa0a6" stroke-dasharray="none" stroke-width="1.4" x1="60" x2="530" y1="365" y2="365" /><polygon fill="#9aa0a6" points="530,361 530,369 540,365" /><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="300.0" y="357">⑤ リダイレクト／カード情報入力</text><line stroke="#9aa0a6" stroke-dasharray="none" stroke-width="1.4" x1="540" x2="770" y1="425" y2="425" /><polygon fill="#9aa0a6" points="770,421 770,429 780,425" /><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="660.0" y="403">⑥ POST（stripe-signature 署名）</text><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="660.0" y="417">customer.subscription.created</text><path d="M 780,470 C 870,470 870,504 780,504" fill="none" stroke="#9aa0a6" stroke-width="1.4" /><polygon fill="#9aa0a6" points="782,499 782,509 770,504" /><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="start" x="795" y="460">⑦ 署名検証 → stripe_events に event.id を INSERT</text><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="start" x="795" y="476">（重複配信ならここで打ち切り＝冪等性チェック）</text><line stroke="#9aa0a6" stroke-dasharray="none" stroke-width="1.4" x1="780" x2="1010" y1="660" y2="660" /><polygon fill="#9aa0a6" points="1010,656 1010,664 1020,660" /><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="900.0" y="638">⑧ upsert：subscriptions / user_profiles</text><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="900.0" y="652">（cancel_at_period_end 等を反映）</text><line stroke="#9aa0a6" stroke-dasharray="5,4" stroke-width="1.4" x1="540" x2="70" y1="720" y2="720" /><polygon fill="#9aa0a6" points="70,716 70,724 60,720" /><text fill="#3d3d3a" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="300.0" y="698">⑨ success_url へリダイレクト</text><text fill="#3d3d3a" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="300.0" y="712">/success?session_id=...</text><line stroke="#9aa0a6" stroke-dasharray="none" stroke-width="1.4" x1="60" x2="1250" y1="780" y2="780" /><polygon fill="#9aa0a6" points="1250,776 1250,784 1260,780" /><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="660.0" y="772">⑩ /success 表示 → /mypage へ遷移</text><line stroke="#9aa0a6" stroke-dasharray="none" stroke-width="1.4" x1="1260" x2="1030" y1="840" y2="840" /><polygon fill="#9aa0a6" points="1030,836 1030,844 1020,840" /><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="1140.0" y="818">⑪ SELECT subscriptions</text><text fill="#0c447c" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="1140.0" y="832">WHERE user_id = ...</text><line stroke="#9aa0a6" stroke-dasharray="5,4" stroke-width="1.4" x1="1020" x2="1250" y1="895" y2="895" /><polygon fill="#9aa0a6" points="1250,891 1250,899 1260,895" /><text fill="#3d3d3a" font-family="Noto Sans CJK JP" font-size="11" text-anchor="middle" x="1140.0" y="887">⑫ cancel_at_period_end / current_period_end</text><rect fill="#fff6da" height="92" rx="4" ry="4" stroke="#e0c15a" stroke-width="1" width="1080" x="300" y="500" /><text fill="#7a5c00" font-family="Noto Sans CJK JP" font-size="11.5" x="318" y="524">運用上の学び：stripe-webhook は verify_jwt: false が必須。</text><text fill="#7a5c00" font-family="Noto Sans CJK JP" font-size="11.5" x="318" y="544">Supabase 側の JWT 検証は Stripe 署名検証より前段で実行されるため、true のままだと</text><text fill="#7a5c00" font-family="Noto Sans CJK JP" font-size="11.5" x="318" y="564">Stripe からの全リクエストが 401（UNAUTHORIZED_NO_AUTH_HEADER）で拒否され、⑦以降に到達しない。</text></svg>